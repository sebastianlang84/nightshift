# nightshift rulebook — human-owned governance (copy to rulebook.yaml and edit).
# Hard prohibitions (no force-push, no deletes, branch-only) live in the hook,
# NOT here (hook-spec.md). This file is soft governance + knobs.

branch_prefix: nightshift/

limits:
  # The ONLY throughput cap: max nightshift/* branches awaiting YOUR VERDICT at once, across all
  # repos. NOT a per-night count. Decide a branch — merge it, or close its PR — and the slot frees
  # up immediately (ADR 0025 reads harvest's verdict, so a rejected branch you never deleted does
  # not keep blocking). Review continuously and it runs all night; stop, and it fills up and stops.
  max_open_branches: 2
  max_findings_per_item: 1       # N ranked findings explore may emit per repo/pass (ADR 0011). Each
                                 # ships as its OWN branch, so N × branch-fix repos can fill the cap
                                 # above — size both to your morning review appetite. Per-repo
                                 # `findings:` overrides. Default 1 = pre-v2 single-finding behavior.
  max_branches_per_run: 50       # HARD safety ceiling per single run (runaway backstop, NOT policy —
                                 # backpressure above is the real governor). Env override:
                                 # NIGHTSHIFT_MAX_RUN_BRANCHES wins only if this is unset.
  max_fix_iterations: 3          # HARD cap on Fix<->Review round-trips per finding before abandon
  max_verifies_per_run: 5        # HARD cap on open findings re-checked per night (ADR 0021). Only
                                 # findings whose target code CHANGED since they were recorded ever
                                 # qualify; each costs one read-only stage call. 0 = never spend a
                                 # model on closure (the free signature probe still runs).
  max_files_per_change: 15       # SOFT — guidance to the agent, not a hard reject
  max_lines_per_change: 400      # SOFT — a bigger change is fine if it's one coherent improvement
  # max_run_minutes: 240         # OPTIONAL wall-clock budget for the whole night (ADR 0013). Checked
                                 # before each pass and each fix: a read-only stage in flight finishes
                                 # but no new branch starts once spent; the digest shows the stop.
                                 # Omit = no time cap. Env override (seconds): NIGHTSHIFT_MAX_RUN_SECONDS.
  test_timeout_seconds: 600      # HARD ceiling for ONE repo's `test_cmd` ship gate (ADR 0022), so a
                                 # hanging suite cannot eat the night. Env override: NIGHTSHIFT_TEST_TIMEOUT.
                                 # Doubles as the gate's per-process CPU-seconds cap (ADR 0026).
  test_memory_mb: 4096           # Gate sandbox memory ceiling (ADR 0026), as RLIMIT_AS — ADDRESS
                                 # SPACE, not resident memory, so keep it generous: a modern Node or
                                 # JVM reserves gigabytes it never touches. 0 = no cap.
  test_max_procs: 2048           # Gate sandbox process ceiling (ADR 0026), as RLIMIT_NPROC — a
                                 # fork-bomb bound. The kernel charges it to the ACCOUNT, not to the
                                 # sandbox, so keep it well above the host's idle count. 0 = no cap.

# Which MODEL each adapter runs its stages on (ADR 0020). Declare it here, not in the CLI's own
# config: stage isolation (ADR 0019) drops the CLI's `user` settings scope, so a machine-wide pin in
# ~/.claude/settings.json never reaches a stage. This file is host-owned and untracked, so setting a
# model here is a host decision — nightshift still ships no model of its own.
# Precedence: NIGHTSHIFT_CLAUDE_MODEL / NIGHTSHIFT_CODEX_MODEL if set (an explicitly EMPTY value
# means "pass no --model") > these keys > whatever the CLI resolves by itself. Omit the block to let
# the CLI decide; the run announces the effective model and its source either way, and
# `state/runs.jsonl` records the model that actually served each stage.
# agent:
#   claude_model: claude-opus-5
#   codex_model: gpt-5.6-sol

recon:                           # reconnaissance stage (ADR 0010): surveys each repo (docs/, compose,
  enabled: true                  # frontend, tests, CI …) and labels each dimension high/normal/low
  ttl_days: 7                    # yield. Re-run when the repo HEAD changes or the cache is older
                                 # than this. Recon reprioritizes, it NEVER excludes (ADR 0015).

# Review dimensions / lenses (ADR 0010). This list is the candidate set, and trimming it is the ONLY
# way to exclude a lens — recon can only make one come up less often (ADR 0015). ORDER = cold-start
# and tie-break priority: at a tie the earliest-listed lens wins, so a fresh repo gets `correctness`
# first. The Runner rotates — each repo/pass gets the lens with the highest staleness × recon yield
# weight, so coverage spreads over nights and even a `low` lens still comes round.
# Trim this list, or override per repo with a repo-level `dimensions:` (comma-separated) key.
dimensions:
  - correctness                  # live/latent bugs, wrong results, unhandled edges
  - security                     # secrets, injection, authz gaps, unsafe defaults (never quotes a secret)
  - infra                        # docker-compose/Dockerfile/CI/systemd/env quality
  - docs                         # docs-vs-code contradictions, stale comments/READMEs
  - tests                        # skipped/assertion-free tests, critical-path coverage gaps
  - perf                         # N+1, sync-in-async, quadratic hot paths, missing indexes
  - ui-ux                        # broken flows, a11y, inconsistent components, missing states, copy
  - deps                         # EOL/vulnerable pins, lockfile drift, unused deps
  - craft                        # smells, dead code, naming — the FLOOR lens

repos:
  - path: /absolute/path/to/your/repo
    mode: findings-only          # start here; graduate to branch-fix by editing this (the trust-ramp)
  # - path: /absolute/path/to/gitflow-repo
  #   mode: branch-fix           # full loop: Explore -> Fix<->Review -> push a nightshift/* branch
  #   base: develop              # OPTIONAL branch to work from. Empty = auto-detect (origin/HEAD ->
  #                              # main/master). Set to `develop` for gitflow repos so fixes branch
  #                              # off the integration branch, not production `main`.
  #   findings: 5                # OPTIONAL per-repo override of max_findings_per_item
  #   dimensions: security,infra,docs  # OPTIONAL per-repo lens set (comma-separated); beats the global list
  #   test_net: false            # OPTIONAL (ADR 0026): network egress for THIS repo's gate sandbox.
  #                              # Off by default, and off is what you want unless the suite installs
  #                              # dependencies as it runs (`npm ci`, `uv run --with-requirements`).
  #                              # Even with it on the sandbox holds no credentials, so the channel
  #                              # carries worktree content, not your SSH key — but it IS a channel.
  #   test_cmd: uv run pytest -q # REQUIRED for branch-fix (ADR 0022/0026): the repo's own suite, run
  #                              # in a disposable bwrap sandbox over the WORKTREE right before the
  #                              # commit, INSIDE the fix<->review loop. A red suite is a revision
  #                              # request, not a death sentence: the Fix stage gets the failing
  #                              # output back and repairs its own regression, up to
  #                              # max_fix_iterations. Only an item still red after those is refused
  #                              # (ledger `tests-failed`, no branch) — and the finding stays
  #                              # unlatched, so a later night may retry it. A repo with no suite to
  #                              # declare belongs in `findings-only`: the parse ABORTS on a
  #                              # branch-fix repo without this key rather than ship ungated.
  #                              # Keep it FAST: it runs once per shipped finding and up to
  #                              # max_fix_iterations times for one that keeps breaking.
  #                              # Must be one line; no tabs. Runs under `bash -c` in the worktree.
