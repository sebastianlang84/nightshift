name: CI

# nightshift had no CI, which is the same gap ADR 0022 closes for the repos it services: the ship
# gate proves a nightshift branch is sound before it is pushed, but nothing proved a HUMAN commit
# was. This runs the same suite the gate runs, on every push to main and every PR.
#
# The push trigger is filtered to main on purpose, and `nightshift/*` branches lose nothing by it.
# The ship gate has already run this exact suite against the branch, locally and in the bwrap
# sandbox, before it was pushed at all; and every one of the twelve that has reached main so far
# came through a PR, which `pull_request` triggers with no branch filter of its own. An unfiltered
# push trigger would be the third run of the same tests, and no decision waits on it — the branch
# is read in the morning, when the PR produces the signal.
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. On 2026-08-06 GitHub accepted two pushes to main (the PushEvents are in the
  # repo's event stream) without dispatching a run for either, while the pushes on both sides of
  # them ran normally — a delivery gap with nothing on this end to fix. Without this, the only way
  # to get CI onto a commit is to push another one on top of it.
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The deep-review regression corpus points at frozen historical commits. A shallow
          # checkout makes those fixtures disappear and turns a sound suite into a CI-only failure.
          fetch-depth: 0

      # The suite needs jq (ledger assertions) and git; python3 is preinstalled. No pip install:
      # lib/*.py is stdlib-only on purpose, and CI must not be the first place that stops being true.
      # bubblewrap is a real runtime dependency since ADR 0026 — without it every branch-fix repo
      # refuses to ship, so every night-level test would fail for that one reason.
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq bubblewrap

      # GitHub's Ubuntu runners ship AppArmor's unprivileged-userns restriction, which is exactly
      # what stops bwrap. Without lifting it the probe below falls back and tests/test-gate-sandbox.sh
      # SKIPS — so the one control that stands between candidate-authored test code and this
      # account's credentials would have no CI coverage at all. It is a runner-local sysctl on a
      # throwaway VM. `|| true`: on a runner where the knob does not exist the probe handles it.
      - name: Allow unprivileged user namespaces (runner-local)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Unprivileged user namespaces are kernel policy, not a package: a hardened or nested runner
      # can refuse them, and then the sandbox cannot be built at all. Rather than a red suite that
      # says nothing about the code, fall back to the documented opt-out and say so loudly — the
      # sandbox's own test skips itself in that case, and everything else still runs.
      - name: Probe the ship-gate sandbox
        run: |
          if bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin \
                   --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
                   --proc /proc --dev /dev /bin/true 2>/dev/null; then
            echo "bwrap works — the suite exercises the real ship-gate sandbox"
          else
            echo "::warning::unprivileged user namespaces unavailable on this runner — running the suite with NIGHTSHIFT_TEST_SANDBOX=none; tests/test-gate-sandbox.sh will SKIP"
            echo "NIGHTSHIFT_TEST_SANDBOX=none" >> "$GITHUB_ENV"
          fi

      # A run creates commits in throwaway sandboxes; git refuses without an identity.
      - name: Configure git identity
        run: |
          git config --global user.name  "ci"
          git config --global user.email "ci@localhost"

      # The docs check first: it is 0.05s and its failure message is the most actionable one.
      - name: Docs name only what exists
        run: python3 lib/check_docs.py .

      # There is no test runner — the suite IS tests/*.sh, and every one must pass.
      - name: Test suite
        run: |
          rc=0
          for t in tests/*.sh; do
            if bash "$t"; then
              echo "PASS $t"
            else
              echo "::error file=$t::$t failed"
              rc=1
            fi
          done
          exit $rc
